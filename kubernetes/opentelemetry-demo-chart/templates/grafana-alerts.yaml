{{- if and .Values.grafana.enabled .Values.grafana.alerting.enabled }}
# Grafana Alert Rules for ADX Observability
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: {{ .Values.namespace }}
  labels:
    grafana_alert: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: alerting
data:
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: email-alerts
        receivers:
          - uid: email-receiver-1
            type: email
            settings:
              addresses: {{ .Values.grafana.alerting.smtp.toAddresses | quote }}
              singleEmail: false
            disableResolveMessage: false
  notification-policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: email-alerts
        group_by:
          - grafana_folder
          - alertname
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h

  adx-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: ADX Observability Alerts
        folder: ADX Alerts
        interval: 1m
        rules:
          # High Error Rate Alert
          - uid: adx-high-error-rate
            title: High Error Rate Detected
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: adx-telemetry
                model:
                  expr: |
                    OTelTraces
                    | where Timestamp > ago(5m)
                    | summarize TotalSpans = count(), ErrorSpans = countif(StatusCode == "Error" or StatusCode == "STATUS_CODE_ERROR")
                    | extend ErrorRate = round(100.0 * ErrorSpans / TotalSpans, 2)
                    | project ErrorRate
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - {{ .Values.grafana.alerting.thresholds.errorRatePercent }}
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 2m
            annotations:
              summary: Error rate is above {{ .Values.grafana.alerting.thresholds.errorRatePercent }}%
              description: "The overall error rate has exceeded the threshold. Current error rate: {{ `{{ $values.A.Value }}` }}%"
            labels:
              severity: critical
              category: errors

          # High Latency Alert (P95)
          - uid: adx-high-latency
            title: High P95 Latency Detected
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: adx-telemetry
                model:
                  expr: |
                    OTelTraces
                    | where Timestamp > ago(5m)
                    | where ParentSpanId == ""
                    | summarize P95Latency = percentile(Duration / 1000000.0, 95)
                    | project P95Latency
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - {{ .Values.grafana.alerting.thresholds.p95LatencyMs }}
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 3m
            annotations:
              summary: P95 latency is above {{ .Values.grafana.alerting.thresholds.p95LatencyMs }}ms
              description: "The P95 latency for root spans has exceeded the threshold. Current P95 latency: {{ `{{ $values.A.Value }}` }}ms"
            labels:
              severity: warning
              category: latency

          # Service Down Alert
          - uid: adx-service-down
            title: Service Not Reporting
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: adx-telemetry
                model:
                  expr: |
                    let expected_services = dynamic(["frontend", "cart", "checkout", "payment", "product-catalog", "currency", "shipping", "recommendation", "ad"]);
                    OTelTraces
                    | where Timestamp > ago(5m)
                    | distinct ServiceName
                    | summarize ActiveCount = count()
                    | extend MissingServices = 9 - ActiveCount
                    | project MissingServices
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: threshold
            noDataState: Alerting
            execErrState: Error
            for: 5m
            annotations:
              summary: One or more services are not reporting
              description: "Expected services are not sending telemetry data. Missing services count: {{ `{{ $values.A.Value }}` }}"
            labels:
              severity: critical
              category: availability

          # Error Logs Spike Alert
          - uid: adx-error-logs-spike
            title: Error Logs Spike Detected
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: adx-telemetry
                model:
                  expr: |
                    OTelLogs
                    | where Timestamp > ago(5m)
                    | where SeverityText == "ERROR" or SeverityNumber >= 17
                    | summarize ErrorCount = count()
                    | project ErrorCount
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - {{ .Values.grafana.alerting.thresholds.errorLogsCount }}
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: threshold
            noDataState: NoData
            execErrState: Error
            for: 2m
            annotations:
              summary: High number of error logs detected
              description: "Error log count has exceeded the threshold in the last 5 minutes. Current error count: {{ `{{ $values.A.Value }}` }}"
            labels:
              severity: warning
              category: logs
{{- end }}